name: Feature request
description: Propose a new feature for dotbugi
labels: [feat]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in the project! You can write in Korean or English (한국어로 작성해도 됩니다).
  - type: textarea
    id: feature-description
    attributes:
      label: Description
      description: A clear and concise description of the problem. Make the reason and use cases as detailed as possible. If you intend to submit a PR, tell us here.
      placeholder: As a student using the LMS, I want [goal] so that [benefit].
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: Suggested solution
      description: Where and how should it work?
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternative
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any other context or screenshots about the feature request.
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        - label: Read the [Contributing Guidelines](https://github.com/hs-shell/dotbugi/blob/main/CONTRIBUTING.md).
          required: true
        - label: Check that there isn't [already an issue](https://github.com/hs-shell/dotbugi/issues) that requests the same feature.
          required: true
