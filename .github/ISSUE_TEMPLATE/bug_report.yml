name: Bug report
description: Report a problem with dotbugi
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! You can write in Korean or English (한국어로 작성해도 됩니다).
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. If you intend to submit a PR for this issue, tell us here.
      placeholder: I did ... I expected ... What actually happened is ...
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the problem. Mention where it happened (popup, LMS page, options).
      placeholder: |
        1. Log in to the LMS and open the extension popup
        2. ...
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: System info
      description: Extension version (see `chrome://extensions`), browser and version, OS
      render: text
      placeholder: |
        dotbugi: 5.1.0
        Browser: Chrome 131
        OS: Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Console log or screenshots, if the steps are not enough. Please paste logs as text.

        Before posting, remove anything private: student ID, name, session cookie.
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        - label: Read the [Contributing Guidelines](https://github.com/hs-shell/dotbugi/blob/main/CONTRIBUTING.md) and the [docs](https://github.com/hs-shell/dotbugi/tree/main/docs).
          required: true
        - label: Check that there isn't [already an issue](https://github.com/hs-shell/dotbugi/issues) that reports the same bug.
          required: true
        - label: The bug still happens on the latest version.
          required: true
        - label: This is a concrete bug. For questions, open a [GitHub Discussion](https://github.com/hs-shell/dotbugi/discussions).
          required: true
