name: Task
description: Work that is not a bug or a feature (docs, CI, refactoring, build, ...)
body:
  - type: markdown
    attributes:
      value: |
        You can write in Korean or English (한국어로 작성해도 됩니다).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Why is this needed, and what is the current state?
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: Tasks
      description: What needs to be done, as a checklist.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: What has to be true for this to be finished?
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      options:
        - label: Check that there isn't [already an issue](https://github.com/hs-shell/dotbugi/issues) for the same work.
          required: true
