# Dependabot 버전 업데이트 설정
# 보안 업데이트만으로는 SHA 고정된 액션과 npm 의존성이 계속 낡아지므로 주기적으로 갱신한다.
# 커밋 접두사는 PR 제목 검증(pr-title.yml)을 통과하도록 Conventional Commits 타입으로 맞춘다.
# (include: scope → 예: "ci(deps): bump ...", "build(deps-dev): bump ...")
version: 2
updates:
  # 워크플로 액션은 커밋 SHA로 고정되어 있어 Dependabot 없이는 갱신되지 않는다.
  # Dependabot이 SHA와 뒤의 "# vX" 주석을 함께 올려준다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 액션 업데이트는 서로 독립적이고 리뷰 부담이 작아 한 PR로 묶는다.
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # PR이 많이 열리면 lockfile 충돌이 반복되므로 수를 제한한다.
    open-pull-requests-limit: 5
    # minor/patch는 한 PR로 묶어 lockfile 충돌을 줄이고,
    # major는 깨지는 변경이 있을 수 있어 개별 PR로 따로 검토한다.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    labels:
      - dependencies
