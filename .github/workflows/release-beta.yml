name: Release Beta

# 베타는 별도 브랜치 없이 main에서 수동으로 발행한다 (prerelease 태그).
# 검증된 빌드는 이후 일반 머지 흐름(release-please)으로 스테이블 승급.
#
# 흐름: beta 잡(빌드 + 프리릴리즈 생성, 승인 없이 자동)
#    → store 잡(environment: beta 승인 후 베타 스토어 항목에 업로드·심사 제출)
#
# 스토어 게시 활성화 (기본 비활성):
#   - Variables: BETA_EXTENSION_ID (베타 스토어 항목 ID, 공개값이라 Secret 아님)
#                + 스테이블과 공유하는 GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT,
#                  CWS_PUBLISHER_ID
#   - Variables: ENABLE_STORE_PUBLISH=true
#   - Environment: beta (Required reviewers 로 승인 게이트)
# 인증은 WIF → 서비스 계정 단기 토큰이라 CHROME_* 같은 장기 Secret 은 필요 없다.
# (CWS 서비스 계정은 퍼블리셔 단위로 등록되므로 베타 항목도 그대로 커버한다)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1) 베타 빌드 + 프리릴리즈 생성 (승인 없이 자동) ──────────────────────
  beta:
    # 다른 브랜치에서 dispatch 하면 보호 규칙·필수 검사를 거치지 않은 코드가 발행되므로 main 만 허용한다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      zip_sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: 베타 버전 계산
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version" | sed 's/-.*//')
          # GitHub 태그/릴리즈는 SemVer prerelease 표기를 쓴다.
          echo "tag=v${BASE}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          # manifest version 은 숫자만 허용 → 4-파트 숫자 스킴으로 별도 계산.
          echo "manifest=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: 의존성 설치
        run: npm ci

      - name: 프로덕션 빌드 (베타)
        run: npm run build
        env:
          RELEASE_CHANNEL: beta
          BETA_VERSION: ${{ steps.ver.outputs.manifest }}

      - name: 릴리즈 manifest 검사 (key 미포함)
        run: node .github/scripts/check-release-manifest.mjs

      - name: dist 압축
        id: zip
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          (cd dist && zip -r "../dotbugi-${TAG}.zip" .)
          echo "sha256=$(sha256sum "dotbugi-${TAG}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 프리릴리즈 생성 + zip 첨부
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dotbugi-${TAG}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "베타(프리릴리즈) 빌드 — ${REF_NAME} @ ${GITHUB_SHA}" \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Discord 베타 알림 (노랑)
        # 웹훅 미설정 여부는 스크립트에서 판단한다 (단계 자신의 env 는 같은 단계의 if 에서 보이지 않음)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STORE_ENABLED: ${{ vars.ENABLE_STORE_PUBLISH == 'true' }}
          TAG: ${{ steps.ver.outputs.tag }}
          JOB_STATUS: ${{ job.status }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) return;
            const tag = process.env.TAG;
            const success = process.env.JOB_STATUS === 'success';
            const awaitingStore = success && process.env.STORE_ENABLED === 'true';
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            // 스토어 게시가 켜져 있으면 같은 실행의 store 잡이 승인 대기 중 → 승인 화면(실행 페이지)으로 안내
            const url = awaitingStore ? `${repoUrl}/actions/runs/${context.runId}` : `${repoUrl}/releases/tag/${tag}`;
            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                embeds: [{
                  title: !success
                    ? `⚠️ 베타 발행 실패 (${tag})`
                    : awaitingStore
                      ? `⏸️ 베타 ${tag} 스토어 게시 승인 대기`
                      : `🚀 베타 릴리즈 ${tag}`,
                  url,
                  description: !success
                    ? '워크플로 로그를 확인해주세요.'
                    : awaitingStore
                      ? '프리릴리즈가 생성되었습니다. 제목을 눌러 **Review deployments → Approve** 하면 베타 스토어 항목 업로드·심사 제출이 진행됩니다.'
                      : '베타(프리릴리즈) 빌드가 발행되었습니다.',
                  color: success ? 0xfee75c : 0xed4245,
                }],
                allowed_mentions: { parse: [] },
              }),
            });
            if (!res.ok) core.warning(`Discord 알림 실패: ${res.status}`);

  # ── 2) 베타 Chrome Web Store 업로드 + 심사 제출 (beta 환경 승인 후) ──────
  # 베타는 별도 스토어 항목이므로 BETA_EXTENSION_ID 로 게시한다.
  # manifest 버전은 beta 잡 빌드에서 BETA_VERSION(숫자 4-파트)으로 주입되어
  # 스토어 버전 규칙(숫자만 허용)을 만족한다.
  # 승인 전에는 GCP 토큰 자체가 발급되지 않는다(WIF 조건이 stable/beta 환경을 요구).
  store:
    needs: beta
    if: github.ref == 'refs/heads/main' && vars.ENABLE_STORE_PUBLISH == 'true'
    environment: beta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF(OIDC) 토큰 발급용
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # 다시 빌드하지 않고 프리릴리즈에 첨부된 바로 그 zip을 올린다 (릴리즈 자산 = 스토어 패키지)
      # Release 자산은 쓰기 권한자가 승인 대기 중에 바꿔치기할 수 있으므로,
      # beta 잡이 만든 해시(잡 출력은 실행 중 변경 불가)와 일치할 때만 진행한다.
      - name: 프리릴리즈 zip 내려받기 + 무결성 검증
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.beta.outputs.tag }}
          EXPECTED_SHA256: ${{ needs.beta.outputs.zip_sha256 }}
        run: |
          gh release download "$TAG" --pattern "dotbugi-${TAG}.zip" --repo "$GITHUB_REPOSITORY"
          echo "${EXPECTED_SHA256}  dotbugi-${TAG}.zip" | sha256sum -c -

      - name: GCP 인증 (WIF → 서비스 계정)
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false # 액세스 토큰만 쓰므로 작업 디렉터리에 자격증명 파일을 남기지 않음

      - name: Chrome Web Store 업로드 + 심사 제출 (beta)
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.BETA_EXTENSION_ID }}
          TAG: ${{ needs.beta.outputs.tag }}
        run: .github/scripts/cws-publish.sh "dotbugi-${TAG}.zip"

      - name: Discord 베타 스토어 결과 알림
        # 웹훅 미설정 여부는 스크립트에서 판단한다 (단계 자신의 env 는 같은 단계의 if 에서 보이지 않음)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ needs.beta.outputs.tag }}
          JOB_STATUS: ${{ job.status }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) return;
            const tag = process.env.TAG;
            const success = process.env.JOB_STATUS === 'success';
            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                embeds: [{
                  title: success ? `📤 베타 ${tag} 스토어 심사 제출 완료` : `⚠️ 베타 ${tag} 스토어 게시 실패`,
                  url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  description: success
                    ? 'Google 심사를 통과하면 베타 항목 사용자에게 자동 배포됩니다.'
                    : '워크플로 로그를 확인한 뒤 잡을 재실행해주세요.',
                  color: success ? 0x57f287 : 0xed4245,
                }],
                allowed_mentions: { parse: [] },
              }),
            });
            if (!res.ok) core.warning(`Discord 알림 실패: ${res.status}`);
