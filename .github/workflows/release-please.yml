name: Release Please

# 트렁크 기반 릴리즈: main 머지는 Release PR만 갱신하고,
# 그 Release PR을 머지할 때만 실제 릴리즈/발행이 일어난다.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # ── 1) Release PR 유지 / Release PR 머지 시 태그·릴리즈 생성 ──────────
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # GitHub App 토큰을 써야 Release PR에 CI(verify/CodeRabbit)가 돈다.
      # (GITHUB_TOKEN이 만든 PR/커밋은 다른 워크플로를 트리거하지 않음)
      - name: GitHub App 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── 2) 릴리즈 생성됨 → 빌드 & 자산 첨부 & (선택)스토어 발행 ──────────
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # stable 환경: 배포 승인(required reviewers) + main 한정. GCP WIF 조건도 이 환경 이름을 요구한다.
    environment: stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # WIF(OIDC) 토큰 발급용
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 프로덕션 빌드
        run: npm run build

      - name: dist 압축
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: cd dist && zip -r "../dotbugi-${TAG}.zip" .

      - name: 릴리즈에 zip 첨부
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "dotbugi-${TAG}.zip" --repo "$GITHUB_REPOSITORY" --clobber

      # ── Chrome Web Store 자동 게시 (기본 비활성) ──────────────────────
      # 활성화: Variables(GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, CWS_PUBLISHER_ID,
      #         STABLE_EXTENSION_ID) + ENABLE_STORE_PUBLISH=true
      # 인증은 WIF로 서비스 계정 단기 토큰을 받아 쓴다 — 저장소에 장기 비밀 없음.
      - name: GCP 인증 (WIF → 서비스 계정)
        id: gcp
        if: vars.ENABLE_STORE_PUBLISH == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false # 액세스 토큰만 쓰므로 작업 디렉터리에 자격증명 파일을 남기지 않음

      - name: Chrome Web Store 게시 (stable)
        if: vars.ENABLE_STORE_PUBLISH == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.STABLE_EXTENSION_ID }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: .github/scripts/cws-publish.sh "dotbugi-${TAG}.zip"

      - name: Discord 릴리즈 알림 (스테이블=초록)
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) return;
            const tag = '${{ needs.release-please.outputs.tag_name }}';
            const success = '${{ job.status }}' === 'success';
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;
            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                embeds: [{
                  title: success ? `✅ 스테이블 릴리즈 ${tag}` : `⚠️ 릴리즈 발행 실패 (${tag})`,
                  url: success ? url : undefined,
                  description: success ? '새 버전이 발행되었습니다.' : '워크플로 로그를 확인해주세요.',
                  color: success ? 0x57f287 : 0xed4245,
                }],
              }),
            });
            if (!res.ok) core.warning(`Discord 알림 실패: ${res.status}`);
