name: PR 검사

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PR 본문에 연결된 이슈 참조가 있는지 검사 (이슈-먼저 정책 강제)
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: 이슈 참조 확인
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // release-please가 자동 생성하는 Release PR은 이슈가 없으므로 예외
            const headRef = context.payload.pull_request.head.ref || '';
            if (headRef.startsWith('release-please--')) {
              core.info('release-please Release PR — 이슈 참조 검사 생략');
              return;
            }
            // Dependabot PR은 이슈 없이 자동 생성된다. 본문의 업스트림 릴리스 노트 링크로 우연히
            // 통과하던 것에 기대지 않도록 명시적으로 예외 처리한다. (브랜치명은 포크에서 위조 가능하므로 작성자로 판별)
            if (context.payload.pull_request.user?.login === 'dependabot[bot]') {
              core.info('Dependabot PR — 이슈 참조 검사 생략');
              return;
            }
            // 템플릿 주석 안의 예시(`#123`)로 통과하지 않도록 HTML 주석을 빼고 본다
            const body = (context.payload.pull_request.body || '').replace(/<!--[\s\S]*?-->/g, '');
            // "#123", "Closes #123", "Fixes #45", "Resolves: #6" 등 + 전체 URL 형태 모두 허용
            const ref = /(close[sd]?|fix(e[sd])?|resolve[sd]?)?\s*:?\s*#\d+/i.test(body)
              || /github\.com\/[^/]+\/[^/]+\/issues\/\d+/i.test(body);
            if (!ref) {
              core.setFailed(
                'PR 본문에 연결된 이슈가 없습니다. ' +
                '`Closes #이슈번호` 형식으로 관련 이슈를 참조해주세요. ' +
                '(모든 변경은 이슈가 먼저 등록되어 있어야 합니다)'
              );
            }

  verify:
    needs: issue-link # 이슈-먼저 정책: 이슈 참조 실패 시 빌드/테스트 낭비 방지
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 포맷 검사 (Prettier)
        run: npx prettier --check .

      - name: 린트 (ESLint)
        run: npm run lint

      - name: 타입 체크 + 빌드
        run: npm run build

      - name: 릴리즈 manifest 검사 (key 미포함)
        run: node .github/scripts/check-release-manifest.mjs

      # 커버리지는 coverage-comment.yml 이 PR 댓글로 올린다
      - name: 테스트 + 커버리지
        run: npm run test:coverage

      - name: 커버리지 결과 저장
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$PR_NUMBER" > coverage/pr-number
          node -e 'const t=require("./coverage/coverage-summary.json").total;console.log("## 테스트 커버리지\n\n| 항목 | % |\n| --- | --- |\n"+["lines","statements","branches","functions"].map(k=>`| ${k} | ${t[k].pct} |`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"

      - name: 커버리지 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/pr-number
          retention-days: 7
