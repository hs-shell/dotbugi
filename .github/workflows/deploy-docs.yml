name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

# 워크플로 기본 권한은 읽기 전용으로 두고, 필요한 권한은 잡 단위로만 부여한다.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # build 잡은 npm ci / docs:build 로 서드파티 코드를 실행하므로 쓰기·OIDC 권한을 주지 않는다.
    # pages: read 는 configure-pages 가 Pages 사이트 정보(GET /repos/{owner}/{repo}/pages)를 조회하는 데 필요하다.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # VitePress lastUpdated 계산용 전체 히스토리. 이후 push 가 없으므로 토큰을 .git/config 에 남기지 않는다.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
      - name: Install dependencies
        run: npm ci
      - name: Build with VitePress
        run: npm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # actions/deploy-pages 가 요구하는 최소 권한만 배포 잡에 부여한다.
    permissions:
      pages: write # Pages 배포 생성
      id-token: write # 배포 출처 검증용 OIDC 토큰 발급
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
    environment: docs
